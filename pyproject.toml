[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postergen"
version = "0.1.0"
description = "Automated research poster layout tool scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "python-pptx>=0.6.23",
]

[project.optional-dependencies]
docling = [
  "docling>=2.0,<3",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
postergen = "postergen.cli:main"
postergen-validate-parser = "postergen.parser_validation:main"
postergen-evaluate = "postergen.batch_eval:main"
postergen-final-evaluate = "postergen.final_eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
postergen = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
